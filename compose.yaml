services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "127.0.0.1:${USESHARE_PORT:-4173}:4173"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts

  production:
    profiles: [production]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "127.0.0.1:${USESHARE_PREVIEW_PORT:-4174}:80"
